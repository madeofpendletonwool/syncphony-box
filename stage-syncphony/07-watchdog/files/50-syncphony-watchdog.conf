# Hardware watchdog (MAD-806, docs/adr/0008-watchdogs-and-self-healing.md).
# systemd pets /dev/watchdog (the BCM's hardware watchdog) at half the
# runtime interval; a kernel or systemd hang that stops the petting
# hard-resets the Pi within 15 s. RebootWatchdogSec bounds a reboot that
# hangs partway, so the box still comes back on its own.
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=2min
