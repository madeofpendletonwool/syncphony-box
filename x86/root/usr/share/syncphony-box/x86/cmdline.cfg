# The kernel command line of this Syncphony Box (MAD-846, ADR 0013).
# grub.cfg sources this file. boxd rewrites the video= token in it from
# resolution= and rotate= in syncphony.txt; keep it one `set` line.
set syncphony_cmdline="boot=overlay quiet splash loglevel=3 vt.global_cursor_default=0 consoleblank=0"
