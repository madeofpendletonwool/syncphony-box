# The Wi-Fi setup hotspot's captive portal (MAD-808, ADR 0010).
#
# NetworkManager's shared mode runs dnsmasq for the box's setup access
# point (connection syncphony-setup, 10.42.0.1/24) and reads this
# directory into it. Two lines turn that network into a captive portal:
#
#   - every name resolves to the box, so a phone's connectivity probe
#     (connectivitycheck.gstatic.com, captive.apple.com, ...) reaches
#     boxd's listener on :80, which redirects it to the setup form;
#   - DHCP option 114 (RFC 8910) names the portal outright, for phones
#     that ask for it instead of probing.
#
# The access point is the only shared-mode connection on the box, so this
# applies to nothing else.
address=/#/10.42.0.1
dhcp-option=114,"http://10.42.0.1/"
