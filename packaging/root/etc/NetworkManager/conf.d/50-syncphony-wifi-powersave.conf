# Wi-Fi power saving off on every connection. A box sits idle on the LAN
# for hours, and with power saving on, some cards (MediaTek mt7921 among
# them) stop answering incoming traffic until the box itself sends
# something: no ping, no SSH, no phone setup form. A mains-powered box
# saves nothing worth that. 2 = disable (NM_SETTING_WIRELESS_POWERSAVE_DISABLE).
[connection]
wifi.powersave = 2
