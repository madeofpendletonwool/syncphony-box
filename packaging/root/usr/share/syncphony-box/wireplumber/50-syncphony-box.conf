# Syncphony box audio tuning. See docs/adr/0004-audio-output.md.
#
# Never suspend an output: waking an ALSA device for the first sound can
# clip its opening notes — audible as ticks between tracks. A wall-powered
# kiosk gains nothing from the idle power saving. Rule syntax:
# wireplumber(5), monitor.alsa.rules.
monitor.alsa.rules = [
	{
		matches = [
			{ node.name = "~alsa_output.*" }
		]
		actions = {
			update-props = {
				session.suspend-timeout-seconds = 0
			}
		}
	}
]
