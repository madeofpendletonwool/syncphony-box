# Persistent logs for the read-only-root box (MAD-805, ADR 0007).
# /var/log/journal is a symlink to /data/journal, so with /data mounted
# (the normal case — the initramfs mounts it before systemd starts)
# journald stores here; without /data it falls back to volatile. Capped
# so the logs can never eat the card.
[Journal]
Storage=auto
SystemMaxUse=50M
