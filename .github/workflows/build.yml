name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Unit tests for the box scripts (bats) and boxd (go), no image build
    # needed. The bats suite pins the syncphony.txt behavior against a
    # host-arch boxd binary built here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: boxd/go.mod

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Lint
        run: make lint

      - name: Run tests
        run: make test

  image:
    # Native arm64 runner: pi-gen builds the arm64 rootfs natively instead of
    # through QEMU emulation, and boxd builds natively too.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: boxd/go.mod

      - name: Build image
        run: make image

      - name: Smoke test
        run: scripts/smoke-test.sh deploy/syncphony-box-*-arm64.img.xz

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: syncphony-box-image-${{ github.sha }}
          compression-level: 0
          if-no-files-found: error
          path: |
            deploy/*.img.xz
            deploy/*.img.xz.sha256
            deploy/*.img.info
